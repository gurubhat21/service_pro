name: service_pro
description: "Service Pro - Track Computer, Laptop, CCTV, Solar & UPS Services"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  firebase_storage: any

  # Google Sign-In
  google_sign_in: any

  # Google Maps & Location
  google_maps_flutter: any
  geolocator: any
  geocoding: any

  # State Management
  provider: any

  # Notifications
  flutter_local_notifications: any

  # UI & Design
  google_fonts: any
  cupertino_icons: ^1.0.8
  shimmer: any
  cached_network_image: any
  flutter_animate: any

  # Utilities
  intl: any
  url_launcher: any
  uuid: any
  image_picker: any
  permission_handler: ^11.0.0
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
